name: Build and Release uYouPlus

on:
  workflow_dispatch:
    inputs:
      uyou_version:
        description: "The version of uYou"
        default: "3.0.4"
        required: true
        type: string
      uyou_url:
        description: "The Google Drive URL or ID for uYou.deb"
        default: "11P6gI28Q5dsDgcbkxN8v3Q-2RLfKi1LZ"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Direct URL to decrypted YouTube ipa"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Modify the bundle ID"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Modify the name of the app"
        default: "YouTube"
        required: true
        type: string

jobs:
  build:
    name: Build uYouPlus
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4.2.1
        with:
          path: main
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make python3
          pip3 install gdown --break-system-packages
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH

      - name: Setup Theos
        uses: actions/checkout@v4.2.1
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Download iOS 16.5 SDK
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git && cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk ../theos/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        run: |
          git clone --recursive https://github.com/qnblackcat/theos-jailed.git theos-jailed
          ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Prepare uYou and YouTube
        run: |
          # Tải uYou.deb
          gdown "https://drive.google.com/uc?export=download&id=${{ inputs.uyou_url }}" -O main/uYou.deb
          
          # Tải và giải nén YouTube IPA
          gdown "https://drive.google.com/uc?export=download&id=${{ inputs.decrypted_youtube_url }}" -O main/YouTube.ipa
          cd main
          unzip -q YouTube.ipa -d Payload_Temp
          # Tìm thư mục .app bên trong Payload
          mv Payload_Temp/Payload/YouTube.app Payload/ 2>/dev/null || mv Payload_Temp/*/Payload/YouTube.app Payload/
          
          # Lấy version tự động
          YT_VER=$(defaults read "$(pwd)/Payload/YouTube.app/Info" CFBundleVersion)
          echo "YT_VER=$YT_VER" >> $GITHUB_ENV

      - name: Build Package
        run: |
          cd main
          # Truyền mọi tham số trực tiếp vào make, không dùng sed nữa
          make package THEOS_PACKAGE_SCHEME=rootless \
            IPA=Payload/YouTube.app \
            FINALPACKAGE=1 \
            DISPLAY_NAME="${{ inputs.app_name }}" \
            BUNDLE_ID="${{ inputs.bundle_id }}" \
            YOUTUBE_VERSION="${{ env.YT_VER }}" \
            THEOS=${{ github.workspace }}/theos
          
          echo "PACKAGE_NAME=$(ls packages/*.ipa | head -n1)" >> $GITHUB_ENV

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.YT_VER }}-${{ github.run_number }}
          name: YouTube v${{ env.YT_VER }} (uYou ${{ inputs.uyou_version }})
          files: main/packages/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
