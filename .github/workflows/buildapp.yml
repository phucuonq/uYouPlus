name: Build and Release uYouPlus

on:
  workflow_dispatch:
    inputs:
      uyou_version:
        description: "Phiên bản uYou"
        default: "3.0.4"
        required: true
        type: string
      uyou_url:
        description: "Link Google Drive uYou.deb"
        default: "https://drive.google.com/file/d/11P6gI28Q5dsDgcbkxN8v3Q-2RLfKi1LZ/view?usp=drivesdk"
        required: true
        type: string
      decrypted_youtube_url:
        description: "Link trực tiếp YouTube IPA đã decrypt"
        default: ""
        required: true
        type: string
      bundle_id:
        description: "Bundle ID (mặc định: com.google.ios.youtube)"
        default: "com.google.ios.youtube"
        required: true
        type: string
      app_name:
        description: "Tên ứng dụng trên màn hình chính"
        default: "YouTube"
        required: true
        type: string

jobs:
  build:
    name: Build uYouPlus
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Main
        uses: actions/checkout@v4
        with:
          path: main
          submodules: recursive

      - name: Install Dependencies
        run: |
          brew install ldid dpkg make python3
          pip3 install gdown --break-system-packages

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: master
          path: theos
          submodules: recursive

      - name: Setup Theos Jailed
        uses: actions/checkout@v4
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Prepare uYou.deb
        run: |
          GDRIVE_URL="${{ inputs.uyou_url }}"
          GDRIVE_ID=$(echo "$GDRIVE_URL" | grep -o 'd/[^/]*' | cut -d'/' -f2 || echo "$GDRIVE_URL")
          gdown "https://drive.google.com/uc?export=download&id=$GDRIVE_ID" -O main/uYou.deb

      - name: Extract uYou
        run: |
          cd main
          mkdir -p Tweaks/uYou
          mv uYou.deb Tweaks/uYou/
          cd Tweaks/uYou
          ar x uYou.deb
          tar -xf data.tar*
          rm -rf *.tar* debian-binary uYou.deb

      - name: Build IPA
        run: |
          cd main
          export THEOS=${{ github.workspace }}/theos
          # Lệnh này sẽ nạp YouTube IPA từ link bạn nhập vào
          gdown "${{ inputs.decrypted_youtube_url }}" -O YouTube.ipa
          # Sửa Makefile trực tiếp để nhận diện Bundle ID và App Name
          sed -i '' "s/BUNDLE_ID = .*/BUNDLE_ID = ${{ inputs.bundle_id }}/" Makefile
          sed -i '' "s/DISPLAY_NAME = .*/DISPLAY_NAME = ${{ inputs.app_name }}/" Makefile
          
          make package THEOS_PACKAGE_SCHEME=rootless IPA=YouTube.ipa FINALPACKAGE=1
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: main/packages/*.ipa
          tag_name: v${{ github.run_number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
